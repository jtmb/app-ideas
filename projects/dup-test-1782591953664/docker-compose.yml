version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
    volumes:
      - ./database.sqlite:/app/database.sqlite
    restart: unless-stopped

  client:
    image: node:20-alpine
    ports:
      - "5173:5173"
    working_dir: /app
    command: npm run dev
    volumes:
      - .:/app
    environment:
      - NODE_ENV=development
    depends_on:
      - app
